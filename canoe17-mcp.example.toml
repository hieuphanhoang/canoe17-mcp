# Run: uv run canoe17-mcp --config canoe17-mcp.example.toml
# Selection is explicit; COM failures never fall back to the fake backend.
backend_kind = "com"
read_only = true
# Empty denies filesystem access. Use absolute project directories on your PC.
allowed_roots = []
# Fake mode models only these in-memory configurations; no files are created/read.
fake_config_paths = []
fake_licensed = false
# Optional absolute audit_path; default: %LOCALAPPDATA%/canoe17-mcp/audit.jsonl.
# Environment override CANOE17_MCP_AUDIT_PATH is a plain path string.
audit_max_bytes = 1048576
audit_backup_count = 2

[backend]
lock_key = "default"
lock_acquire_timeout_s = 0
dispatch_timeout_s = 10
operation_default_timeout_s = 30
operation_max_timeout_s = 3600
launch_step_s = 180
open_step_s = 120
save_step_s = 120
compile_step_s = 120
quick_step_s = 15
report_finalize_timeout_s = 30
min_evidence = "demo_verified"
capl_allowlist = []
allow_launch = true
